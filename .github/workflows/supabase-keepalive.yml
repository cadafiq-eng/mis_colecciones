# Mantiene activo el proyecto Supabase "miscol" (plan gratuito)
# Ubicación en el repositorio: .github/workflows/supabase-keepalive.yml
#
# Requisitos (Settings > Secrets and variables > Actions):
#   Secret   SUPABASE_ANON_KEY  -> clave "anon public" del proyecto

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 14 */3 * *"   # cada 3 días, 08:17 hora de Mérida
  workflow_dispatch:          # permite ejecutarlo manualmente para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a la base de datos
        env:
          SUPABASE_URL: https://gqcfqzwyqgvpvxzvowcl.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TABLE: collections
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/$TABLE?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Respuesta HTTP: $status"
          if [ "$status" != "200" ]; then
            echo "El ping falló. Revise si el proyecto está pausado o si la tabla existe."
            exit 1
          fi
