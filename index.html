<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0f3460"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Colecciones"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <title>MisColecciones</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#1a1a2e; --surface:#16213e; --surface2:#0f3460;
      --accent:#e94560; --accent2:#533483;
      --text:#eaeaea; --text2:#a0a0b0; --border:#2a2a4a;
      --success:#4ecca3; --warning:#f7b731; --radius:12px;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    /* Modo claro */
    body.light {
      --bg:#f0f2f5; --surface:#ffffff; --surface2:#e2e8f0;
      --accent:#e94560; --accent2:#533483;
      --text:#1a1a2e; --text2:#64748b; --border:#cbd5e1;
      --success:#059669; --warning:#d97706;
    }
    body.light .app-header{background:linear-gradient(135deg,#533483,#e94560)}
    body.light .fab{box-shadow:0 4px 20px rgba(233,69,96,.3)}
    body.light #loginPage{background:var(--bg)}
    body.light .login-box{box-shadow:0 4px 24px rgba(0,0,0,.1)}
    /* Transicion suave al cambiar modo */
    body{transition:background .3s,color .3s}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);max-width:640px;margin:0 auto}

    /* LOGIN */
    #loginPage{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:20px;z-index:500}
    #loginPage.hidden{display:none}
    .login-logo{display:flex;align-items:center;gap:14px;margin-bottom:8px}
    .login-logo h1{font-size:24px;font-weight:700}
    .login-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
    .login-box h2{font-size:16px;font-weight:600;color:var(--text2);text-align:center}
    .login-input{background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 14px;font-size:15px;outline:none;width:100%;transition:border-color .2s}
    .login-input:focus{border-color:var(--accent2)}
    .login-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;padding:13px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
    .login-btn:active{opacity:.8}
    .login-btn.ghost{background:var(--surface2);margin-top:-4px;font-size:13px;padding:11px}
    .login-err{font-size:12px;color:var(--accent);text-align:center;min-height:14px}
    .login-ok{font-size:12px;color:var(--success);text-align:center;min-height:14px;display:none}
    .login-note{font-size:11px;color:var(--text2);text-align:center;line-height:1.5}
    .login-links{display:flex;justify-content:center;gap:20px}
    .login-link{background:none;border:none;color:var(--accent2);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px 0}
    .login-divider{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:11px;margin:2px 0}
    .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}

    /* HEADER */
    .app-header{background:linear-gradient(135deg,var(--surface2),var(--accent2));padding:12px 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
    .app-header h1{font-size:16px;font-weight:700;flex:1}
    .hbtn{background:rgba(255,255,255,.18);border:none;border-radius:8px;color:#fff;cursor:pointer;padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap}
    .hbtn:active{background:rgba(255,255,255,.32)}

    /* SYNC BAR */
    #syncBar{background:var(--surface);border-bottom:1px solid var(--border);padding:5px 14px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2);flex-shrink:0}
    #syncDot{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0;transition:background .3s}
    #syncDot.syncing{background:var(--warning);animation:blink .8s infinite}
    #syncDot.error{background:var(--accent)}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    #syncLabel{flex:1}
    #userEmail{font-size:10px;color:var(--accent2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* PAGES */
    #pages{flex:1;overflow:hidden;position:relative}
    .page{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;overflow:hidden;background:var(--bg)}
    .page.hidden{transform:translateX(100%);opacity:0;pointer-events:none}
    .page.slide-left{transform:translateX(-30%);opacity:0;pointer-events:none}

    /* COLLECTIONS */
    .search-bar{padding:10px 14px;flex-shrink:0}
    .search-bar input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 14px;font-size:14px;outline:none;transition:border-color .2s}
    .search-bar input:focus{border-color:var(--accent2)}
    .col-list{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;padding-bottom:80px}
    .col-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .18s;-webkit-user-select:none;user-select:none}
    .col-card:active{background:#1e1e3a;transform:scale(.98)}
    .col-emoji{font-size:26px;width:46px;height:46px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .col-info{flex:1;min-width:0}
    .col-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .col-count{font-size:12px;color:var(--text2);margin-top:3px}
    .col-chevron{color:var(--text2);font-size:20px;flex-shrink:0;font-weight:300}
    .fab{position:absolute;right:18px;bottom:18px;width:56px;height:56px;border-radius:28px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-size:32px;font-weight:300;cursor:pointer;box-shadow:0 4px 20px rgba(233,69,96,.4);display:flex;align-items:center;justify-content:center;transition:transform .15s;z-index:10;line-height:1}
    .fab:active{transform:scale(.92)}

    /* PAGE HEADER */
    .page-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
    .back-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px 8px;border-radius:8px;font-size:22px;font-weight:300;display:flex;align-items:center;line-height:1}
    .back-btn:active{background:var(--border)}
    .page-header h2{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .icon-btn{background:none;border:none;cursor:pointer;color:var(--text2);padding:5px 8px;border-radius:8px;font-size:13px;font-weight:600;transition:all .2s;white-space:nowrap}
    .icon-btn:active{background:var(--border)}
    .icon-btn.danger{color:var(--accent)}

    /* ITEMS */
    .add-page-bar{margin:10px 14px;background:rgba(78,204,163,.12);border:1px solid rgba(78,204,163,.25);border-radius:10px;color:var(--success);cursor:pointer;padding:10px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0}
    .add-page-bar:active{background:rgba(78,204,163,.22)}
    .items-list{flex:1;overflow-y:auto;padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
    .item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;gap:10px;align-items:flex-start}
    .item-icon{width:36px;height:36px;border-radius:8px;background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;color:var(--text2)}
    .item-icon img{width:100%;height:100%;object-fit:cover}
    .item-body{flex:1;min-width:0}
    .item-title{font-size:13px;font-weight:600;line-height:1.3;word-break:break-word}
    .item-url{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .item-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:4px;text-transform:uppercase;letter-spacing:.3px}
    .badge-link,.badge-page{background:rgba(78,204,163,.15);color:var(--success)}
    .badge-text{background:rgba(247,183,49,.15);color:var(--warning)}
    .badge-image{background:rgba(83,52,131,.3);color:#a78bfa}
    .item-note{font-size:11px;color:var(--text2);margin-top:4px;font-style:italic}
    .item-actions{display:flex;flex-direction:column;gap:4px}
    .item-btn{background:none;border:none;cursor:pointer;padding:5px 7px;border-radius:6px;font-size:12px;font-weight:700;transition:all .2s}
    .item-btn.open{color:var(--success)}
    .item-btn.del{color:var(--accent)}
    .item-btn:active{background:var(--border)}

    /* ADD FORM */
    .add-form{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;padding-bottom:30px}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-label{font-size:11px;color:var(--text2);font-weight:700;letter-spacing:.5px}
    .form-input{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 14px;font-size:14px;outline:none;transition:border-color .2s;font-family:inherit;width:100%}
    .form-input:focus{border-color:var(--accent2)}
    textarea.form-input{resize:none;min-height:80px}
    .form-select{appearance:none;-webkit-appearance:none}
    select.form-input option{background:var(--surface)}
    .btn-row{display:flex;gap:10px}
    .btn-primary{flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;cursor:pointer;padding:13px;font-size:15px;font-weight:700}
    .btn-primary:active{opacity:.8}
    .btn-ghost{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text2);cursor:pointer;padding:13px 18px;font-size:15px}
    .btn-ghost:active{border-color:var(--text2)}
    .section-divider{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:11px;font-weight:700;letter-spacing:.5px}
    .section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:var(--border)}

    /* SHARE BANNER */
    #shareBanner{display:none;flex-shrink:0;background:linear-gradient(135deg,rgba(78,204,163,.2),rgba(83,52,131,.3));border-bottom:2px solid var(--success);padding:12px 16px}
    #shareBanner.visible{display:block}
    .share-title{font-size:11px;font-weight:700;color:var(--success);letter-spacing:.4px;margin-bottom:5px}
    .share-url{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);margin-bottom:8px}
    .share-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .share-select{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;outline:none}
    .share-save{background:var(--success);color:#000;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
    .share-dismiss{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px 8px;font-size:13px;font-weight:700}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;align-items:flex-end;justify-content:center;padding-bottom:var(--safe-bottom)}
    .modal-overlay.open{display:flex}
    .modal{background:var(--surface);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px;animation:slideUp .25s ease;max-height:85vh;overflow-y:auto}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto -6px}
    .modal h3{font-size:17px;font-weight:700}
    .emoji-grid{display:flex;flex-wrap:wrap;gap:8px}
    .emoji-opt{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;background:var(--bg);border:2px solid var(--border);transition:all .15s}
    .emoji-opt.selected{border-color:var(--accent);background:rgba(233,69,96,.12)}

    /* EMPTY / LOADING */
    .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text2);padding:32px;text-align:center}
    .empty-state p{font-size:14px;line-height:1.6}
    .spinner-wrap{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text2);font-size:14px}
    .spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--success);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* TOAST */
    #toast{position:fixed;bottom:calc(var(--safe-bottom) + 18px);left:50%;transform:translateX(-50%);background:var(--success);color:#000;padding:9px 20px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:300;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3)}
    #toast.show{opacity:1}

    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-logo">
    <svg width="36" height="36" fill="none" viewBox="0 0 24 24">
      <rect x="2" y="3" width="9" height="9" rx="2" fill="#e94560"/>
      <rect x="13" y="3" width="9" height="9" rx="2" fill="#a78bfa"/>
      <rect x="2" y="14" width="9" height="9" rx="2" fill="#4ecca3"/>
      <rect x="13" y="14" width="9" height="9" rx="2" fill="#f7b731"/>
    </svg>
    <h1>MisColecciones</h1>
  </div>
  <div class="login-box">
    <h2 id="loginTitle">Iniciar sesion</h2>
    <input class="login-input" type="email" id="loginEmail" placeholder="Correo electronico" autocomplete="email"/>
    <input class="login-input" type="password" id="loginPassword" placeholder="Contrase&#xF1;a" autocomplete="current-password"/>
    <input class="login-input" type="password" id="loginPassword2" placeholder="Repetir contrase&#xF1;a" style="display:none" autocomplete="new-password"/>
    <div class="login-err" id="loginErr"></div>
    <div class="login-ok" id="loginOk"></div>
    <button class="login-btn" id="loginBtn">Entrar</button>
    <div class="login-divider">o</div>
    <div class="login-links">
      <button class="login-link" id="switchRegisterBtn">Crear cuenta nueva</button>
      <button class="login-link" id="forgotBtn">Olvid&eacute; mi contrase&ntilde;a</button>
    </div>
    <p class="login-note" id="loginNote">Tus colecciones se sincronizan automaticamente entre todos tus dispositivos.</p>
  </div>
</div>

<!-- APP HEADER -->
<div class="app-header">
  <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
    <rect x="2" y="3" width="9" height="9" rx="2" fill="#e94560"/>
    <rect x="13" y="3" width="9" height="9" rx="2" fill="#a78bfa"/>
    <rect x="2" y="14" width="9" height="9" rx="2" fill="#4ecca3"/>
    <rect x="13" y="14" width="9" height="9" rx="2" fill="#f7b731"/>
  </svg>
  <h1>MisColecciones</h1>
  <div style="display:flex;gap:6px">
    <button class="hbtn" id="themeBtn" title="Cambiar modo">&#9788;</button>
    <button class="hbtn" id="importBtn">Importar</button>
    <button class="hbtn" id="exportBtn">Exportar</button>
    <button class="hbtn" id="logoutBtn">Salir</button>
  </div>
</div>

<!-- SYNC BAR -->
<div id="syncBar">
  <div id="syncDot" class="syncing"></div>
  <span id="syncLabel">Conectando...</span>
  <span id="userEmail"></span>
</div>

<!-- SHARE BANNER -->
<div id="shareBanner">
  <div class="share-title">PAGINA RECIBIDA - ELIGE DONDE GUARDAR</div>
  <div class="share-url" id="shareBannerUrl"></div>
  <div class="share-row">
    <select class="share-select" id="shareColSelect"></select>
    <button class="share-save" id="shareSaveBtn">Guardar</button>
    <button class="share-dismiss" id="shareDismiss">X</button>
  </div>
</div>

<!-- PAGES -->
<div id="pages">

  <!-- COLLECTIONS PAGE -->
  <div class="page" id="colPage">
    <div class="search-bar">
      <input type="search" id="searchInput" placeholder="Buscar colecciones..."/>
    </div>
    <div class="col-list" id="colList">
      <div class="spinner-wrap"><div class="spinner"></div> Cargando...</div>
    </div>
    <button class="fab" id="newColFab">+</button>
  </div>

  <!-- ITEMS PAGE -->
  <div class="page hidden" id="itemPage">
    <div class="page-header">
      <button class="back-btn" id="backToCollections">&lt;</button>
      <h2 id="itemPageTitle">Coleccion</h2>
      <button class="icon-btn" id="renameColBtn">Renombrar</button>
      <button class="icon-btn danger" id="deleteColBtn">Eliminar</button>
    </div>
    <div class="add-page-bar" id="addCurrentBar">+ Agregar URL / texto</div>
    <div class="items-list" id="itemsList"></div>
  </div>

  <!-- ADD PAGE -->
  <div class="page hidden" id="addPage">
    <div class="page-header">
      <button class="back-btn" id="backToItems">&lt;</button>
      <h2>Agregar elemento</h2>
    </div>
    <div class="add-form">
      <div class="form-group">
        <label class="form-label">COLECCION</label>
        <select class="form-input form-select" id="addTargetCol"></select>
      </div>
      <div class="section-divider">ENLACE / URL</div>
      <div class="form-group">
        <label class="form-label">DIRECCION WEB</label>
        <input class="form-input" type="url" id="addUrl" placeholder="https://..."/>
      </div>
      <div class="form-group">
        <label class="form-label">TITULO</label>
        <input class="form-input" type="text" id="addTitle" placeholder="Nombre del enlace"/>
      </div>
      <div class="form-group">
        <label class="form-label">NOTA (opcional)</label>
        <textarea class="form-input" id="addNote" placeholder="Por que guardas este enlace?"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn-ghost" id="cancelAdd">Cancelar</button>
        <button class="btn-primary" id="confirmAdd">Guardar enlace</button>
      </div>
      <div class="section-divider">TEXTO / NOTA LIBRE</div>
      <div class="form-group">
        <label class="form-label">TEXTO</label>
        <textarea class="form-input" id="addText" placeholder="Escribe o pega el texto que quieres guardar..." style="min-height:100px"></textarea>
      </div>
      <button class="btn-primary" id="confirmAddText">Guardar texto</button>
    </div>
  </div>

</div>

<!-- MODAL: Nueva coleccion -->
<div class="modal-overlay" id="newColModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Nueva coleccion</h3>
    <div class="form-group">
      <label class="form-label">NOMBRE</label>
      <input class="form-input" type="text" id="newColName" placeholder="Ej: Investigacion, Recetas..." maxlength="40"/>
    </div>
    <div class="form-group">
      <label class="form-label">ICONO</label>
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>
    <div class="btn-row">
      <button class="btn-ghost" id="cancelNewCol">Cancelar</button>
      <button class="btn-primary" id="confirmNewCol">Crear</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none"/>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
// SUPABASE CONFIG
// Reemplaza TU_ANON_KEY_AQUI con tu anon public key
// ═══════════════════════════════════════════
const SUPABASE_URL = 'https://gqcfqzwyqgvpvxzvowcl.supabase.co';
const SUPABASE_KEY = 'TU_ANON_KEY_AQUI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ═══════════════════════════════════════════
// EMOJIS (defined in JS to avoid encoding issues)
// ═══════════════════════════════════════════
const EMOJIS = ['📁','⭐','🔬','📚','🍽','💡','🎯','🛒','🧪','✈','💼','🎨','🏠','📝','🤖','🌱','🏋','🎵','📊','🔗'];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let app = { collections:[], currentColId:null, selectedEmoji:'📁', userId:null, channel:null, pendingShare:null };

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function esc(s){ if(!s)return''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function genId(){ return 'item_'+Date.now()+Math.random().toString(36).substr(2,5); }
function getCol(id){ return app.collections.find(c=>c.id===id); }
function getType(item){
  // Detect type robustly — old items may lack 'type' field
  if(item.type && ['page','link','text','image'].includes(item.type)) return item.type;
  if(item.url) return 'link';
  if(item.content) return 'text';
  return 'link';
}
function typeLabel(t){ return {page:'Pagina',link:'Enlace',text:'Texto',image:'Imagen'}[t]||'Enlace'; }

function toast(msg, color){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.background=color||'#4ecca3';
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400);
}
function setSyncStatus(cls, label){
  document.getElementById('syncDot').className=cls;
  document.getElementById('syncLabel').textContent=label;
}

// ═══════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════
// ── LOGIN MODE: 'login' | 'register' | 'forgot' ──
let loginMode = 'login';

function setLoginMode(mode){
  loginMode = mode;
  const title   = document.getElementById('loginTitle');
  const btn     = document.getElementById('loginBtn');
  const pass2   = document.getElementById('loginPassword2');
  const note    = document.getElementById('loginNote');
  const swBtn   = document.getElementById('switchRegisterBtn');
  const forgBtn = document.getElementById('forgotBtn');
  const errEl   = document.getElementById('loginErr');
  const okEl    = document.getElementById('loginOk');
  errEl.textContent=''; okEl.style.display='none'; okEl.textContent='';
  if(mode==='login'){
    title.textContent='Iniciar sesion';
    btn.textContent='Entrar';
    pass2.style.display='none';
    note.textContent='Tus colecciones se sincronizan automaticamente entre todos tus dispositivos.';
    swBtn.textContent='Crear cuenta nueva';
    forgBtn.style.display='inline';
  } else if(mode==='register'){
    title.textContent='Crear cuenta nueva';
    btn.textContent='Registrarme';
    pass2.style.display='block';
    note.textContent='Cada cuenta tiene sus propias colecciones separadas.';
    swBtn.textContent='Ya tengo cuenta, entrar';
    forgBtn.style.display='none';
  } else if(mode==='forgot'){
    title.textContent='Recuperar contraseña';
    btn.textContent='Enviar correo de recuperacion';
    pass2.style.display='none';
    note.textContent='Te enviaremos un enlace para restablecer tu contraseña.';
    swBtn.textContent='Volver al inicio de sesion';
    forgBtn.style.display='none';
  }
}

async function checkSession(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){ app.userId=session.user.id; document.getElementById('userEmail').textContent=session.user.email; showApp(); }
  else showLogin();
}
function showLogin(){ document.getElementById('loginPage').classList.remove('hidden'); setLoginMode('login'); }
function showApp(){ document.getElementById('loginPage').classList.add('hidden'); loadCollections(); subscribeRealtime(); }

async function doLoginAction(){
  const email  = document.getElementById('loginEmail').value.trim();
  const pass   = document.getElementById('loginPassword').value;
  const pass2  = document.getElementById('loginPassword2').value;
  const errEl  = document.getElementById('loginErr');
  const okEl   = document.getElementById('loginOk');
  const btn    = document.getElementById('loginBtn');
  errEl.textContent=''; okEl.style.display='none';

  if(loginMode==='login'){
    if(!email||!pass){errEl.textContent='Ingresa correo y contraseña';return;}
    btn.textContent='Entrando...'; btn.disabled=true;
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    btn.textContent='Entrar'; btn.disabled=false;
    if(error){errEl.textContent='Correo o contraseña incorrectos';return;}
    app.userId=data.user.id;
    document.getElementById('userEmail').textContent=data.user.email;
    showApp();

  } else if(loginMode==='register'){
    if(!email||!pass){errEl.textContent='Ingresa correo y contraseña';return;}
    if(pass.length<6){errEl.textContent='La contraseña debe tener al menos 6 caracteres';return;}
    if(pass!==pass2){errEl.textContent='Las contraseñas no coinciden';return;}
    btn.textContent='Registrando...'; btn.disabled=true;
    const {data,error}=await sb.auth.signUp({email,password:pass});
    btn.textContent='Registrarme'; btn.disabled=false;
    if(error){errEl.textContent='Error: '+error.message;return;}
    // Some Supabase configs require email confirmation
    if(data.user&&data.session){
      app.userId=data.user.id;
      document.getElementById('userEmail').textContent=data.user.email;
      showApp();
    } else {
      okEl.textContent='Revisa tu correo para confirmar tu cuenta, luego inicia sesion.';
      okEl.style.display='block';
      setLoginMode('login');
      document.getElementById('loginEmail').value=email;
    }

  } else if(loginMode==='forgot'){
    if(!email){errEl.textContent='Ingresa tu correo electronico';return;}
    btn.textContent='Enviando...'; btn.disabled=true;
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});
    btn.textContent='Enviar correo de recuperacion'; btn.disabled=false;
    if(error){errEl.textContent='Error: '+error.message;return;}
    okEl.textContent='Correo enviado. Revisa tu bandeja de entrada.';
    okEl.style.display='block';
    setTimeout(()=>setLoginMode('login'),3000);
  }
}

async function doLogout(){
  if(!confirm('Cerrar sesion?'))return;
  if(app.channel) sb.removeChannel(app.channel);
  await sb.auth.signOut();
  app.collections=[]; app.userId=null;
  showLogin();
}

// ═══════════════════════════════════════════
// SUPABASE CRUD
// ═══════════════════════════════════════════
async function loadCollections(){
  setSyncStatus('syncing','Cargando...');
  const {data,error}=await sb.from('collections').select('*').eq('user_id',app.userId).order('created_at',{ascending:true});
  if(error){setSyncStatus('error','Error al cargar');return;}
  app.collections=data||[];
  setSyncStatus('','Sincronizado');
  renderCollections();
  if(document.getElementById('shareBanner').classList.contains('visible')) populateShareSelect();
}
async function createCollection(name,emoji){
  setSyncStatus('syncing','Guardando...');
  const {error}=await sb.from('collections').insert({user_id:app.userId,name,emoji,items:[],description:''});
  if(error){setSyncStatus('error','Error');toast('Error al crear','#e94560');}
  else setSyncStatus('','Sincronizado');
}
async function updateCollection(id,changes){
  setSyncStatus('syncing','Guardando...');
  const {error}=await sb.from('collections').update({...changes,updated_at:new Date().toISOString()}).eq('id',id).eq('user_id',app.userId);
  if(error){setSyncStatus('error','Error al guardar');return false;}
  setSyncStatus('','Sincronizado'); return true;
}
async function deleteCollection(id){
  setSyncStatus('syncing','Eliminando...');
  await sb.from('collections').delete().eq('id',id).eq('user_id',app.userId);
  setSyncStatus('','Sincronizado');
}

// ═══════════════════════════════════════════
// REALTIME
// ═══════════════════════════════════════════
function subscribeRealtime(){
  if(app.channel) sb.removeChannel(app.channel);
  app.channel=sb.channel('col-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'collections',filter:`user_id=eq.${app.userId}`},handleRT)
    .subscribe(s=>{
      if(s==='SUBSCRIBED') setSyncStatus('','Sincronizado en tiempo real');
      if(s==='CLOSED') setSyncStatus('error','Sin conexion en tiempo real');
    });
}
function handleRT({eventType,new:nr,old:or}){
  if(eventType==='INSERT'&&!app.collections.find(c=>c.id===nr.id)){ app.collections.push(nr); toast('Nueva coleccion sincronizada'); }
  else if(eventType==='UPDATE'){ const i=app.collections.findIndex(c=>c.id===nr.id); if(i!==-1){app.collections[i]=nr; if(app.currentColId===nr.id) renderItems(nr);} }
  else if(eventType==='DELETE'){ app.collections=app.collections.filter(c=>c.id!==or.id); if(app.currentColId===or.id){showPage('colPage','back');toast('Coleccion eliminada desde otro dispositivo','#f7b731');} }
  renderCollections(document.getElementById('searchInput').value);
}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
function showPage(id,dir='forward'){
  document.querySelectorAll('.page').forEach(p=>{
    const t=p.id===id;
    p.classList.toggle('hidden',!t);
    p.classList.toggle('slide-left',!t&&dir==='forward');
    if(t) p.classList.remove('hidden','slide-left');
  });
}

// ═══════════════════════════════════════════
// RENDER COLLECTIONS
// ═══════════════════════════════════════════
function renderCollections(filter){
  const list=document.getElementById('colList');
  list.innerHTML='';
  const q=(filter||'').toLowerCase();
  const cols=q?app.collections.filter(c=>c.name.toLowerCase().includes(q)):app.collections;
  if(!cols.length&&!q){
    list.innerHTML='<div class="empty-state"><p>No tienes colecciones todavia.<br>Toca <strong>+</strong> para crear una.</p></div>';
    return;
  }
  if(!cols.length){
    list.innerHTML='<div class="empty-state"><p>Sin resultados para "'+esc(q)+'"</p></div>';
    return;
  }
  cols.forEach(col=>{
    const items=Array.isArray(col.items)?col.items:[];
    const card=document.createElement('div');
    card.className='col-card';
    card.innerHTML=
      '<div class="col-emoji">'+esc(col.emoji||'📁')+'</div>'+
      '<div class="col-info">'+
        '<div class="col-name">'+esc(col.name)+'</div>'+
        '<div class="col-count">'+items.length+' elemento'+(items.length!==1?'s':'')+'</div>'+
      '</div>'+
      '<div class="col-chevron">&rsaquo;</div>';
    card.onclick=()=>openCol(col.id);
    list.appendChild(card);
  });
}

// ═══════════════════════════════════════════
// ITEMS
// ═══════════════════════════════════════════
function openCol(id){
  app.currentColId=id;
  const col=getCol(id);
  if(!col)return;
  document.getElementById('itemPageTitle').textContent=(col.emoji||'📁')+' '+col.name;
  renderItems(col);
  showPage('itemPage');
}
function renderItems(col){
  const list=document.getElementById('itemsList');
  list.innerHTML='';
  const items=Array.isArray(col.items)?col.items:[];
  if(!items.length){
    list.innerHTML='<div class="empty-state"><p>Coleccion vacia.<br>Toca el boton de arriba para agregar.</p></div>';
    return;
  }
  items.slice().reverse().forEach((item,ri)=>{
    const idx=items.length-1-ri;
    const t=getType(item);
    const urlDisplay=item.url||item.pageUrl||'';
    const titleDisplay=item.title||(t==='text'?(item.content||'').substring(0,60)+'...':'');
    const dateStr=item.date?new Date(item.date).toLocaleDateString('es-MX'):'';
    let iconHtml='';
    if(t==='page'&&item.favicon) iconHtml='<img src="'+esc(item.favicon)+'" onerror="this.style.display=\'none\'"/>';
    else if(t==='link') iconHtml='<svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/><path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/></svg>';
    else if(t==='text') iconHtml='<svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"/></svg>';
    else iconHtml='<svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>';
    const card=document.createElement('div');
    card.className='item-card';
    card.innerHTML=
      '<div class="item-icon">'+iconHtml+'</div>'+
      '<div class="item-body">'+
        '<div class="item-title">'+esc(titleDisplay||'Sin titulo')+'</div>'+
        (urlDisplay?'<div class="item-url">'+esc(urlDisplay)+'</div>':'')+
        '<span class="item-badge badge-'+t+'">'+typeLabel(t)+'</span>'+
        (item.note?'<div class="item-note">"'+esc(item.note)+'"</div>':'')+
        (t==='text'?'<div class="item-note" style="color:var(--text);margin-top:6px">'+esc((item.content||'').substring(0,160))+((item.content||'').length>160?'...':'')+'</div>':'')+
        (dateStr?'<div class="item-url" style="margin-top:3px">'+dateStr+'</div>':'')+
      '</div>'+
      '<div class="item-actions">'+
        (urlDisplay?'<button class="item-btn open" onclick="openUrl(\''+esc(urlDisplay)+'\')" title="Abrir">Abrir</button>':'')+
        '<button class="item-btn del" onclick="deleteItem('+idx+')" title="Eliminar">Borrar</button>'+
      '</div>';
    list.appendChild(card);
  });
}
function openUrl(url){ window.open(url,'_blank','noopener'); }
async function deleteItem(idx){
  if(!confirm('Eliminar este elemento?'))return;
  const col=getCol(app.currentColId);
  const items=[...(col.items||[])];
  items.splice(idx,1);
  const ok=await updateCollection(col.id,{items});
  if(ok){col.items=items;renderItems(col);toast('Eliminado','#f7b731');}
}

// ═══════════════════════════════════════════
// ADD ITEM
// ═══════════════════════════════════════════
function openAddPage(){
  const sel=document.getElementById('addTargetCol');
  sel.innerHTML=app.collections.map(c=>'<option value="'+c.id+'">'+(c.emoji||'📁')+' '+esc(c.name)+'</option>').join('');
  if(app.currentColId) sel.value=app.currentColId;
  ['addUrl','addTitle','addNote','addText'].forEach(id=>document.getElementById(id).value='');
  showPage('addPage');
}
async function saveLink(){
  const url=document.getElementById('addUrl').value.trim();
  const title=document.getElementById('addTitle').value.trim();
  const note=document.getElementById('addNote').value.trim();
  const colId=document.getElementById('addTargetCol').value;
  if(!url){toast('Ingresa una URL','#e94560');return;}
  if(!colId){toast('Selecciona una coleccion','#e94560');return;}
  const col=getCol(colId);
  const items=[...(col.items||[]),{id:genId(),type:'link',title:title||url,url,note,date:new Date().toISOString()}];
  const ok=await updateCollection(colId,{items});
  if(ok){col.items=items;app.currentColId=colId;renderItems(col);document.getElementById('itemPageTitle').textContent=(col.emoji||'📁')+' '+col.name;toast('Guardado en '+col.name);showPage('itemPage','back');}
}
async function saveText(){
  const text=document.getElementById('addText').value.trim();
  const colId=document.getElementById('addTargetCol').value;
  if(!text){toast('Escribe algo','#e94560');return;}
  if(!colId){toast('Selecciona una coleccion','#e94560');return;}
  const col=getCol(colId);
  const items=[...(col.items||[]),{id:genId(),type:'text',title:text.substring(0,60)+(text.length>60?'...':''),content:text,note:'',date:new Date().toISOString()}];
  const ok=await updateCollection(colId,{items});
  if(ok){col.items=items;app.currentColId=colId;renderItems(col);document.getElementById('itemPageTitle').textContent=(col.emoji||'📁')+' '+col.name;toast('Texto guardado');showPage('itemPage','back');}
}

// ═══════════════════════════════════════════
// SHARE BANNER
// ═══════════════════════════════════════════
function populateShareSelect(){
  const sel=document.getElementById('shareColSelect');
  sel.innerHTML=!app.collections.length?'<option value="">Primero crea una coleccion</option>':app.collections.map(c=>'<option value="'+c.id+'">'+(c.emoji||'📁')+' '+esc(c.name)+'</option>').join('');
}
function showShareBanner(sd){
  app.pendingShare=sd;
  const txt=sd.title||sd.url||sd.text||'';
  document.getElementById('shareBannerUrl').textContent=txt.substring(0,80)+(txt.length>80?'...':'');
  populateShareSelect();
  document.getElementById('shareBanner').classList.add('visible');
  window.history.replaceState({},'','./index.html');
}
async function saveSharedItem(){
  const colId=document.getElementById('shareColSelect').value;
  if(!colId){toast('Crea una coleccion primero','#e94560');return;}
  const col=getCol(colId); const sd=app.pendingShare;
  const url=sd.url||'';
  const items=[...(col.items||[]),{id:genId(),type:url?'link':'text',title:sd.title||url||'Sin titulo',url,content:sd.text||'',note:'',date:new Date().toISOString()}];
  const ok=await updateCollection(colId,{items});
  if(ok){col.items=items;toast('Guardado en '+(col.emoji||'📁')+' '+col.name);document.getElementById('shareBanner').classList.remove('visible');app.pendingShare=null;}
}

// ═══════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════
function doExport(){
  const blob=new Blob([JSON.stringify({version:2,exportDate:new Date().toISOString(),collections:app.collections},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='MisColecciones_'+new Date().toISOString().split('T')[0]+'.json'; a.click();
  toast('Exportado correctamente');
}

// ═══════════════════════════════════════════
// IMPORT
// ═══════════════════════════════════════════
async function doImport(file){
  try {
    const d=JSON.parse(await file.text());
    const incoming=Array.isArray(d)?d:(d.collections||[]);
    if(!incoming.length){toast('El archivo esta vacio o tiene formato incorrecto','#e94560');return;}
    let added=0, skipped=0;
    for(const col of incoming){
      if(!col.name) continue;
      // Check if collection with same name already exists
      const exists=app.collections.find(c=>c.name===col.name);
      if(exists){skipped++;continue;}
      await sb.from('collections').insert({
        user_id:app.userId,
        name:col.name,
        emoji:col.emoji||'📁',
        items:col.items||[],
        description:col.description||''
      });
      added++;
    }
    await loadCollections();
    toast('Importado: '+added+' nuevas, '+skipped+' ya existian');
  } catch(e){ toast('Error al importar: '+e.message,'#e94560'); }
}

// ═══════════════════════════════════════════
// THEME (day / night)
// ═══════════════════════════════════════════
function initTheme(){
  const saved=localStorage.getItem('mc_theme')||'dark';
  applyTheme(saved);
}
function applyTheme(mode){
  document.body.classList.toggle('light', mode==='light');
  document.getElementById('themeBtn').textContent = mode==='light' ? '\u263D' : '\u2600';
  localStorage.setItem('mc_theme', mode);
}
function toggleTheme(){
  const isLight=document.body.classList.contains('light');
  applyTheme(isLight?'dark':'light');
}

// NEW COLLECTION MODAL
// ═══════════════════════════════════════════
function buildEmojiGrid(){
  const grid=document.getElementById('emojiGrid');
  grid.innerHTML='';
  EMOJIS.forEach(e=>{
    const span=document.createElement('span');
    span.className='emoji-opt'+(e===app.selectedEmoji?' selected':'');
    span.textContent=e; span.dataset.e=e;
    span.onclick=()=>{app.selectedEmoji=e;document.querySelectorAll('.emoji-opt').forEach(o=>o.classList.toggle('selected',o.dataset.e===e));};
    grid.appendChild(span);
  });
}
function openNewColModal(){
  document.getElementById('newColName').value='';
  app.selectedEmoji='📁'; buildEmojiGrid();
  document.getElementById('newColModal').classList.add('open');
  setTimeout(()=>document.getElementById('newColName').focus(),300);
}
function closeNewColModal(){ document.getElementById('newColModal').classList.remove('open'); }
async function doCreateCollection(){
  const name=document.getElementById('newColName').value.trim();
  if(!name){document.getElementById('newColName').focus();return;}
  await createCollection(name,app.selectedEmoji);
  closeNewColModal(); toast('Coleccion creada: '+name);
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded',async()=>{
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.error);

  // Share target params
  const p=new URLSearchParams(location.search);
  const su=p.get('url')||'', st=p.get('title')||'', sx=p.get('text')||'';
  if(su||st||sx) app.pendingShare={url:su,title:st,text:sx};

  await checkSession();
  if(app.pendingShare&&app.userId) setTimeout(()=>showShareBanner(app.pendingShare),500);

  document.getElementById('loginBtn').onclick=doLoginAction;
  document.getElementById('loginPassword').onkeydown=e=>{if(e.key==='Enter')doLoginAction();};
  document.getElementById('loginPassword2').onkeydown=e=>{if(e.key==='Enter')doLoginAction();};
  document.getElementById('switchRegisterBtn').onclick=()=>setLoginMode(loginMode==='login'?'register':'login');
  document.getElementById('forgotBtn').onclick=()=>setLoginMode('forgot');
  document.getElementById('logoutBtn').onclick=doLogout;
  document.getElementById('exportBtn').onclick=doExport;
  document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange=e=>{if(e.target.files[0])doImport(e.target.files[0]);};
  document.getElementById('themeBtn').onclick=toggleTheme;
  initTheme();
  document.getElementById('searchInput').addEventListener('input',e=>renderCollections(e.target.value));
  document.getElementById('newColFab').onclick=openNewColModal;
  document.getElementById('addCurrentBar').onclick=openAddPage;
  document.getElementById('backToCollections').onclick=()=>{showPage('colPage','back');renderCollections();};
  document.getElementById('backToItems').onclick=()=>showPage('itemPage','back');
  document.getElementById('renameColBtn').onclick=async()=>{
    const col=getCol(app.currentColId); if(!col)return;
    const n=prompt('Nuevo nombre:',col.name); if(!n?.trim())return;
    const ok=await updateCollection(col.id,{name:n.trim()});
    if(ok){col.name=n.trim();document.getElementById('itemPageTitle').textContent=(col.emoji||'📁')+' '+col.name;toast('Nombre actualizado');}
  };
  document.getElementById('deleteColBtn').onclick=async()=>{
    if(!confirm('Eliminar esta coleccion y todos sus elementos?'))return;
    await deleteCollection(app.currentColId);
    app.collections=app.collections.filter(c=>c.id!==app.currentColId);
    showPage('colPage','back'); renderCollections(); toast('Coleccion eliminada','#e94560');
  };
  document.getElementById('confirmAdd').onclick=saveLink;
  document.getElementById('confirmAddText').onclick=saveText;
  document.getElementById('cancelAdd').onclick=()=>showPage('itemPage','back');
  document.getElementById('cancelNewCol').onclick=closeNewColModal;
  document.getElementById('confirmNewCol').onclick=doCreateCollection;
  document.getElementById('newColName').onkeydown=e=>{if(e.key==='Enter')doCreateCollection();};
  document.getElementById('newColModal').onclick=e=>{if(e.target.id==='newColModal')closeNewColModal();};
  document.getElementById('shareSaveBtn').onclick=saveSharedItem;
  document.getElementById('shareDismiss').onclick=()=>{document.getElementById('shareBanner').classList.remove('visible');app.pendingShare=null;};
});
</script>
</body>
</html>
